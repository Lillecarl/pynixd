[pytest]
# addopts = --maxfail=1
addopts = --tb=short
log_cli = false
# log_cli_level = DEBUG
# log_cli_format = %(message)s
# log_cli_date_format=%Y-%m-%d %H:%M:%S
testpaths = tests
python_files = test_*.py
python_functions = test_*
anyio_mode = auto
markers =
    nixbuild: tests that require eu.nixbuild.net access
    nixbuildnet: tests that require nixbuild.net access
    store: tests using --store (pynixd as eval store)
    builders: tests using --builders (pynixd as remote builder)
    dag: tests building multi-layer DAG derivations
    slow: tests that are slow and should be excluded by default
    bench: benchmark tests that measure performance
    benchmark: dedicated performance measurement tests
    ca_derivations: tests requiring CA/dynamic derivation support
    legacy_nix_commands: tests using nix-store, nix-instantiate, etc.
    differential: builds one derivation through both goal systems and compares the stores