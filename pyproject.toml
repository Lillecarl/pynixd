[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd"
version = "0.1.0"
description = "Python Nix daemon protocol proxy over SSH"
requires-python = ">=3.13"
dependencies = [
    "asyncssh",
    "aiohttp",
    "aiosqlite",
    "environs",
    "pyinstrument",
    "structlog",
    "passlib",
    "cachetools",
    "prometheus_client",
    "uvloop",
    "anyio",
    "nix-daemon-protocol>=0.1.0",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
pynixd = "pynixd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle errors & warnings
    "E", "W",
    # isort
    "I",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-type-checking
    "TC",
    # Ruff-specific
    "RUF",
    # flake8-comprehensions
    "C4",
    # trailing commas — handled by ruff format, don't select COM812
    # commented-out code
    "ERA",
    # pyupgrade
    "UP",
    # flake8-builtins
    "A",
    # flake8-use-pathlib
    "PTH",
    # flake8-unused-arguments
    "ARG",
    # Perflint
    "PERF",
    # flake8-return
    "RET",
    # flake8-raise
    "RSE",
    # flake8-print
    "T20",
    # flake8-pie
    "PIE",
    # flake8-2020
    "YTT",
    # flake8-async
    "ASYNC",
    # tryceratops
    "TRY",
    # refurb
    "FURB",
    # flake8-tidy-imports
    "TID",
    # pep8-naming
    "N",
    # flynt
    "FLY",
    # pyupgrade
    "UP",
    # flake8-quotes
    "Q",
    # flake8-future-annotations
    "FA",
    # flake8-pytest-style
    "PT",
    # flake8-blind-except
    "BLE",
    # flake8-todos
    "TD",
    # flake8-logging
    "LOG",
]

ignore = [
    # E501 line length — we use line-length=120 instead of the default 88
    "E501",
    # open-file-without-context-manager in http decompression generators
    # (generator assigns the handle then wraps with `with ctx as f:`)
    "SIM115",
    # relative imports — pynixd uses relative imports by design within packages
    "TID252",
    # unused method arguments — protocol interfaces have uniform signatures
    # (from_reader, to_writer, execute, handle) where not every param is used
    "ARG002",
    # long exception messages are acceptable — custom subclasses would be excessive
    "TRY003",
    # blind except — production code always logs before passing; AGENTS.md convention
    "BLE001",
]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ERA001", "RUF059", "F401", "T201", "ARG001"]
# tests/ai are scripts, not standard tests — BLE/print patterns intentional
"tests/ai/**" = ["ERA001", "RUF059", "F401", "T201", "ARG001", "BLE001"]
# conftest rmtree_robust uses bare except intentionally for error recovery
"tests/conftest.py" = ["ERA001", "RUF059", "F401", "T201", "ARG001", "BLE001"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
pythonVersion = "3.13"
exclude = ["**/result*"]
