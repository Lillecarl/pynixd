[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pynixd"
version = "0.1.0"
description = "Python Nix daemon protocol proxy over SSH"
requires-python = ">=3.13"
# PEP 639. The repository is Apache-2.0. `nanopynix-bindings` alone is
# LGPL-2.1-or-later, because that project links libnixexpr and libnixstore,
# and `AGENTS.md` says why the two live together without a conflict.
#
# The file is a copy of the one at the root of the repository, because the
# source root of this project is this directory, and a path above it is not in
# the sdist.
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
    "asyncssh",
    "aiohttp",
    "aiosqlite",
    "pyinstrument",
    "structlog",
    "passlib",
    "cachetools",
    "prometheus_client",
    "uvloop",
    "anyio",
    "nix-daemon-protocol>=0.1.0",
    # The six below were imported and not declared, and issue #131 found them.
    # A shell built from `shell.nix` supplied each one, so no import failed in
    # the repository this project came from. An install of the distribution
    # alone got as far as `import pynixd` and then raised ModuleNotFoundError
    # on `lz4`, which is what a consumer of the wheel would see.
    #
    # `pydantic` arrives through `nix-daemon-protocol` as well. It is here
    # because `config.py` and one other module import it directly, and a
    # dependency of a dependency is not a promise.
    "brotli",
    "lz4",
    "pynacl",
    "pydantic>=2",
    "pydantic-settings",
    "zstandard",
]

[project.optional-dependencies]
test = [
    "pytest",
    # **`environs` is a test dependency now, and it was a runtime one.**
    # `tests/_conftest/config.py` reads a binary path through it, which
    # `pynixd/CLAUDE.md` asks of a test. No module of the wheel imports it any
    # more: it answered four `env.int` and `env.str` calls with literal
    # defaults, nothing ever called `env.read_env()`, and it pulled
    # `marshmallow` and `python-dotenv` into every daemon start for 64 ms.
    # Issue #290.
    "environs",
]

[project.scripts]
pynixd = "pynixd.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pynixd"]

[tool.pyright]
pythonVersion = "3.13"
exclude = ["**/result*"]
