[pytest]
# This subproject had no configuration of its own, so pytest walked up and
# took `pynixd/pytest.ini`. The suite then ran under the rootdir of pynixd and
# read the markers of pynixd, and it needed `anyio_mode` from that file to run
# an async test at all. `nix build --file . checks.nix-daemon-protocol` runs
# this suite against a venv that holds this project alone, and that venv holds
# no pynixd, so the configuration has to be here.
testpaths = tests
python_files = test_*.py
python_functions = test_*
anyio_mode = auto
