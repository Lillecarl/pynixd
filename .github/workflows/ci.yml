# GENERATED FILE -- do not edit by hand.
# Edit ci/workflows/ci.nix, then run: nix run --file . ci-workflow-update

env:
  UMBRELLA_GIT: '1'
jobs:
  docs-build:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    if: github.ref == 'refs/heads/develop'
    needs: umbrella-rev
    runs-on: ubuntu-24.04
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - name: Make room on the runner
      run: |
        df -h /
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox
        docker system prune --all --force
        docker builder prune --all --force
        df -h /
      timeout-minutes: 10
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          trusted-users = root runner
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
    - timeout-minutes: 15
      uses: cachix/cachix-action@master
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        name: lillecarl
        useDaemon: false
    - name: Build documentation
      run: nix build --file . pynixd-docs --out-link result --print-build-logs --print-out-paths
    - name: Verify docs closure
      run: nix store verify --recursive --no-trust "$(readlink -f result)"
    - name: Prepare Pages artifact
      run: |
        mkdir -p public
        cp -r --no-preserve=mode,ownership result/. public/
    - uses: actions/upload-pages-artifact@v3
      with:
        path: public
    timeout-minutes: 20
  docs-deploy:
    concurrency:
      cancel-in-progress: false
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
    - id: deployment
      name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v4
  nix-functional-tests:
    env:
      JOBS: '4'
      NIXFT_WORK: /tmp/nixft
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    needs: umbrella-rev
    runs-on: ubuntu-latest
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - name: Make room on the runner
      run: |
        df -h /
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox
        docker system prune --all --force
        docker builder prune --all --force
        df -h /
      timeout-minutes: 10
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          trusted-users = root runner
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
    - name: Allow the unprivileged user namespaces Nix and passt need
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        unshare --user --map-root-user --mount --pid --fork --mount-proc true
      timeout-minutes: 5
    - name: Build the suite for nix 2.34
      run: nix build --file . nixFunctionalTests.nix_2_34 --out-link nixft --print-build-logs
    - name: Both arms, and the comparison
      run: ./nixft/bin/nanopynix-nixft-nix_2_34 all
    - if: failure()
      name: Keep the test log of a red run
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: nixft-logs
        path: /tmp/nixft/build/meson-logs
        retention-days: 7
    timeout-minutes: 90
  test:
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    needs: umbrella-rev
    runs-on: ubuntu-latest
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
    - name: Make room on the runner
      run: |
        df -h /
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox
        docker system prune --all --force
        docker builder prune --all --force
        df -h /
      timeout-minutes: 10
    - timeout-minutes: 15
      uses: cachix/install-nix-action@master
      with:
        extra_nix_config: |
          access-tokens = github.com=${{ github.token }}
          experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          trusted-users = root runner
        install_url: https://releases.nixos.org/nix/nix-2.34.8/install
    - name: Allow the unprivileged user namespaces Nix and passt need
      run: |
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo sysctl -w kernel.unprivileged_userns_clone=1
        unshare --user --map-root-user --mount --pid --fork --mount-proc true
      timeout-minutes: 5
    - name: Record the Nix settings of this runner
      run: nix config show || true
    - name: Generate SSH key for ssh-ng:// tests
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q
    - name: Format, lint and types
      run: nix build --file . checks.format checks.lint checks.types --no-link --print-build-logs
    - name: Tests
      run: nix develop --impure --file shell.nix --command pytest tests/functional tests/unit
    - name: Protocol tests
      run: nix develop --impure --file shell.nix --command pytest nix-daemon-protocol/tests
    - name: Differential tests
      run: nix develop --impure --file shell.nix --command pytest tests/differential
    - name: Parity tests
      run: nix develop --impure --file shell.nix --command pytest tests/parity
    - name: The workflow render
      run: nix build --file . checks.ciWorkflow --no-link --print-build-logs
    - if: failure()
      name: Keep the per-test logs of a red run
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: pynixd-logs
        path: /tmp/pynixd-logs
        retention-days: 7
    timeout-minutes: 45
  umbrella-rev:
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
    - timeout-minutes: 10
      uses: actions/checkout@main
      with:
        fetch-depth: 100
    - id: resolve
      name: Resolve the umbrella revision
      run: ci/walkback.sh https://github.com/nixidae/nixidae pynixd | sed 's/^/rev=/' >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
name: CI
'on':
  pull_request: null
  push:
    branches:
    - '**'
