name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# UMBRELLA_GIT makes the umbrella fetch each source over the git protocol,
# and not through api.github.com. Anonymous api.github.com allows 60 calls an
# hour per IP, GitHub's runners share a NAT pool, and every source a job
# resolves is one call. nanopynix issue #301.
env:
  UMBRELLA_GIT: "1"

jobs:
  # One umbrella revision for the whole run.
  #
  # `nix/sources.nix` resolves the umbrella from UMBRELLA_REV when it is set.
  # Without it that reference is unlocked, so every job takes the head of the
  # default branch at the moment it starts. `umbrella land` pushes the working
  # copies, which starts the run, and the umbrella lock commit follows seconds
  # later, so a run that straddles the push reads two umbrellas. Measured in
  # nixkube run 35026926963: seven seconds apart, two store paths, and a later
  # job asking for one nothing had built. nanopynix issue #301.
  #
  # git ls-remote uses the git protocol, which the api.github.com limit above
  # does not count. It takes three seconds.
  #
  # Every job below that runs nix reads it. docs-deploy runs none, and it
  # already waits for docs-build.
  umbrella-rev:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    steps:
      - id: resolve
        name: Resolve the umbrella revision
        run: git ls-remote https://github.com/nixidae/nixidae main | cut -f1 | sed 's/^/rev=/' >> "$GITHUB_OUTPUT"

  docs-build:
    if: github.ref == 'refs/heads/develop'
    needs: umbrella-rev
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: cachix/cachix-action@v15
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Build documentation
        run: nix build --file . pynixd-docs --out-link result --print-build-logs --print-out-paths

      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -r --no-preserve=mode,ownership result/. public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  docs-deploy:
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test:
    needs: umbrella-rev
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v34
        with:
          nix_conf: |
            extra-experimental-features = nix-command flakes read-only-local-store ca-derivations dynamic-derivations recursive-nix

      - name: Verify Nix
        run: nix build --version

      - name: Generate SSH key for ssh-ng:// tests
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -q

      - name: Run checks
        run: nix develop --impure --file shell.nix --command just precommit
